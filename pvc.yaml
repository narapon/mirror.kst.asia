apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-pvc
  namespace: mirror-sg
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 3Gi
  volumeName: mirror-pv
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-logs-pvc
  namespace: mirror-sg
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: mirror-logs-pv
  storageClassName: longhorn