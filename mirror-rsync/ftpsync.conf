########################################################################
## ftpsync configuration for mirror.kst.asia Debian mirror
########################################################################

## Mirror name - used for trace file
MIRRORNAME="mirror.kst.asia"

## Destination directory for the mirror
TO="/mnt/mirror/debian"

## Upstream rsync server (Australian mirror)
RSYNC_HOST="ftp.au.debian.org"
RSYNC_PATH="debian"

## Log settings
LOGDIR="/var/log/ftpsync"
ERRORSONLY="true"
FULLLOGS="false"
MAILTO=""

## Architecture filtering - only mirror amd64, arm64, all, and source
## Excludes: i386, armel, armhf, mips*, ppc64el, s390x, riscv64, loong64
ARCH_EXCLUDE="alpha arm armel armhf hppa hurd-i386 i386 ia64 kfreebsd-amd64 kfreebsd-i386 m68k mips mipsel mips64el powerpc ppc64el s390 s390x sh sparc riscv64 loong64"

## Trace file format - required for official Debian mirrors
EXTENDEDTRACE="full"

## Lockfile settings
LOCK="${TO}/Archive-Update-in-Progress-${MIRRORNAME}"

## Log rotation
LOGROTATE=14

## Sleep and retry settings when upstream is updating
UIPSLEEP=1200
UIPRETRIES=3
